name: openagent-infrastructure
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagent
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: ${OPENAGENT_POSTGRES_PASSWORD:?Set OPENAGENT_POSTGRES_PASSWORD}
    ports:
      # 可选：宿主机端口冲突时修改左侧端口；右侧 5432 是容器内部端口。
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d openagent"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      # 可选：宿主机端口冲突时修改左侧端口。
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO 官方镜像已于 2026-09 从 Docker Hub 与 quay.io 删除，固定标签仅在本机缓存
    # 或镜像加速器仍有时可拉取。新环境无法拉取时，用内网仓库或加速器地址覆盖，例如
    # OPENAGENT_MINIO_IMAGE=docker.m.daocloud.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    image: ${OPENAGENT_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    profiles:
      - storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OPENAGENT_S3_ACCESS_KEY:?Set OPENAGENT_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OPENAGENT_S3_SECRET_KEY:?Set OPENAGENT_S3_SECRET_KEY}
    ports:
      # 可选：分别调整 MinIO S3 API 与管理控制台的宿主机端口。
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    # 同上：mc 客户端镜像同批被上游删除，按需用可访问的镜像源覆盖 OPENAGENT_MC_IMAGE。
    image: ${OPENAGENT_MC_IMAGE:-minio/mc:RELEASE.2025-05-21T01-59-54Z}
    profiles:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 ${OPENAGENT_S3_ACCESS_KEY:?Set OPENAGENT_S3_ACCESS_KEY} ${OPENAGENT_S3_SECRET_KEY:?Set OPENAGENT_S3_SECRET_KEY} &&
      mc mb --ignore-existing local/openagent-files"

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.7.2
    # 可选服务；使用固定的 HTTPS 启动方式，部署时只需配置对外地址和管理员凭据。
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://localhost:58081
      # 可选覆盖：生产环境设置强管理员凭据并替换公开地址。
      # KC_BOOTSTRAP_ADMIN_USERNAME: ${OPENAGENT_KEYCLOAK_ADMIN_USERNAME:?Set an administrator name}
      # KC_BOOTSTRAP_ADMIN_PASSWORD: ${OPENAGENT_KEYCLOAK_ADMIN_PASSWORD:?Set a strong administrator password}
      # KC_HOSTNAME: ${OPENAGENT_KEYCLOAK_PUBLIC_URL:-https://localhost:58081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      KC_HTTPS_PORT: "8443"
      OPENAGENT_CHAT_PUBLIC_URL: https://localhost:8081
      # 可选：与应用 Compose 的 CORS 和 Chat 地址保持一致。
      # OPENAGENT_CHAT_PUBLIC_URL: ${OPENAGENT_CHAT_PUBLIC_URL:-https://localhost:8081}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ../openagent/nginx/certs:/opt/keycloak/conf/certs:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "58081:8443"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  keycloak-data:

networks:
  default:
    name: openagent-infrastructure
