name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeact:
    name: Isolated code execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_CODEACT_BWRAP_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Bubblewrap and document runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles apparmor-utils python3-venv libreoffice-impress libreoffice-calc fonts-noto-cjk
          sudo install --mode 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          python3 -m venv "$RUNNER_TEMP/openagent-code-venv"
          "$RUNNER_TEMP/openagent-code-venv/bin/pip" install --disable-pip-version-check --no-cache-dir \
            --requirement Backend/src/OpenAgent.Runner/sandbox/requirements.txt
          echo "CODEACT_TEST_PYTHON=$RUNNER_TEMP/openagent-code-venv/bin/python" >> "$GITHUB_ENV"
      - name: Test real Bubblewrap isolation and document generation
        run: dotnet test Backend/tests/OpenAgent.Runner.Tests/OpenAgent.Runner.Tests.csproj --configuration Release --nologo --verbosity normal
      - name: Publish and smoke-test Runner service
        run: |
          dotnet publish Backend/src/OpenAgent.Runner/OpenAgent.Runner.csproj --configuration Release --output "$RUNNER_TEMP/openagent-runner"
          export CODEACT_RUNNER_DLL="$RUNNER_TEMP/openagent-runner/OpenAgent.Runner.dll"
          python3 scripts/test-codeact-runner.py

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Backend/OpenAgent.sln

      - name: Build solution
        run: dotnet build Backend/OpenAgent.sln --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test Backend/OpenAgent.sln --configuration Release --no-build --no-restore --nologo --verbosity normal

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Frontend/OpenAgent.Chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/OpenAgent.Chat/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
