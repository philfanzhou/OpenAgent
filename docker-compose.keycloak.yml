services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OPENAGENT_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OPENAGENT_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${OPENAGENT_KEYCLOAK_PORT:-58081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${OPENAGENT_KEYCLOAK_PORT:-58081}:8080"
    networks:
      - infrastructure

  engine:
    environment:
      Authentication__Mode: JwtBearer
      Authentication__EnableKeycloak: "true"
      Authentication__EnableTenant: "true"
      Authentication__Authority: http://localhost:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent
      Authentication__MetadataAddress: http://keycloak:8080/realms/openagent/.well-known/openid-configuration
      Authentication__Audience: openagent-api
      Authentication__ClientId: openagent-chat
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      keycloak:
        condition: service_started

  router:
    environment:
      Authentication__Mode: JwtBearer
      Authentication__EnableKeycloak: "true"
      Authentication__EnableTenant: "true"
      Authentication__Authority: http://localhost:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent
      Authentication__MetadataAddress: http://keycloak:8080/realms/openagent/.well-known/openid-configuration
      Authentication__Audience: openagent-api
      Authentication__ClientId: openagent-chat
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      keycloak:
        condition: service_started

volumes:
  keycloak-data:

networks:
  infrastructure:
    external: true
    name: ${OPENAGENT_INFRA_NETWORK:-openagent-infrastructure}
