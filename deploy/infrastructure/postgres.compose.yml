name: ${OPENAGENT_INFRA_PROJECT:-openagent-infrastructure}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openagent}
      POSTGRES_USER: ${POSTGRES_USER:-openagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${OPENAGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
networks:
  default:
    external: true
    name: ${OPENAGENT_APP_NETWORK:-openagent-infrastructure}
