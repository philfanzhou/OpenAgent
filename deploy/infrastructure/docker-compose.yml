# Optional combined local dependencies. Keycloak is deployed separately.
# Requires Docker Compose >= 2.20 and the shared external network.
name: ${OPENAGENT_INFRA_PROJECT:-openagent-infrastructure}
include:
  - path: postgres.compose.yml
    env_file: ${OPENAGENT_POSTGRES_ENV_FILE:-./postgres.env}
  - path: redis.compose.yml
    env_file: ${OPENAGENT_REDIS_ENV_FILE:-./redis.env}
  - path: minio.compose.yml
    env_file: ${OPENAGENT_MINIO_ENV_FILE:-./minio.env}
