name: openagent-nginx
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${OPENAGENT_CHAT_PORT}:${OPENAGENT_CHAT_PORT}"
      - "${OPENAGENT_ROUTER_PORT}:${OPENAGENT_ROUTER_PORT}"
      - "${OPENAGENT_ENGINE_PORT}:${OPENAGENT_ENGINE_PORT}"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Keep the infrastructure certificate location until that stack is migrated.
      - ${OPENAGENT_TLS_CERT_DIR}:/etc/nginx/tls:ro
    networks:
      - openagent

networks:
  openagent:
    # Nginx owns this network; application stacks only join it as external.
    name: openagent
