# Opt-in nested Bubblewrap container. Deploy on a dedicated trusted Runner host/VM.
services:
  engine:
    environment:
      CodeExecution__Enabled: "true"
      CodeExecution__Endpoint: http://runner:5209
      CodeExecution__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?Set a random Runner API key of at least 32 characters}
      CodeExecution__RequestTimeoutSeconds: "180"
    networks:
      - codeact
    depends_on:
      runner:
        condition: service_healthy
  runner:
    image: ${OPENAGENT_RUNNER_IMAGE:-openagent-runner:latest}
    environment:
      ASPNETCORE_URLS: http://+:5209
      Runner__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?Set a random Runner API key of at least 32 characters}
    networks:
      - codeact
    privileged: true
    security_opt:
      - seccomp:unconfined
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5209/health"]
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  codeact:
    internal: true
