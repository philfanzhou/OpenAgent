name: openagent-app
services:
  engine:
    image: openagent-engine:latest
    env_file:
      - ./.env
      - ./engine/.env
    networks:
      - openagent
      - infrastructure
    volumes:
      - engine-data-protection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5208/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  router:
    image: openagent-router:latest
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file:
      - ./.env
      - ./router/.env
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - openagent
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5001/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  chat:
    image: openagent-chat:latest
    depends_on:
      router:
        condition: service_healthy
    networks:
      - openagent

networks:
  openagent:
    external: true
    name: openagent
  infrastructure:
    external: true
    name: openagent-infrastructure

volumes:
  engine-data-protection:
