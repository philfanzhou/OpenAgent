services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagent
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: openagent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${OPENAGENT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d openagent"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${OPENAGENT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  engine:
    build:
      context: .
      dockerfile: Backend/src/OpenAgent.Engine.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5208
      ConnectionStrings__OpenAgentDatabase: Host=postgres;Port=5432;Database=openagent;Username=openagent;Password=openagent
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      ConversationCache__Enabled: "true"
      FileAssets__Enabled: "true"
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OpenTelemetry__ServiceName: agent-engine
      OpenTelemetry__ServiceVersion: development
      FileAssets__ObjectStorage__ServiceUrl: ${OPENAGENT_S3_SERVICE_URL:-https://10.51.0.156:9021}
      FileAssets__ObjectStorage__ForcePathStyle: "true"
      FileAssets__ObjectStorage__AllowInsecureTls: "true"
      FileAssets__ObjectStorage__BucketName: ${OPENAGENT_S3_BUCKET:-agent}
      FileAssets__ObjectStorage__AccessKey: ${OPENAGENT_S3_ACCESS_KEY}
      FileAssets__ObjectStorage__SecretKey: ${OPENAGENT_S3_SECRET_KEY}
      Engine__AllowMockAgent: "true"
      Heartbeat__AdvertisedHost: engine
      Heartbeat__AdvertisedPort: "5208"
      Authentication__AllowDevelopmentAnonymous: "false"
      Cors__AllowedOrigins__0: http://localhost:${OPENAGENT_CHAT_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${OPENAGENT_ENGINE_PORT:-5208}:5208"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5208/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  router:
    build:
      context: .
      dockerfile: Backend/src/OpenAgent.Router/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Redis: redis:6379
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OpenTelemetry__ServiceName: agent-router
      OpenTelemetry__ServiceVersion: development
      RouterSettings__Routing__EngineEndpoint: http://engine:5208
      RouterSettings__IntentRecognition__TimeoutMs: "30000"
      Authentication__AllowDevelopmentAnonymous: "false"
      Cors__AllowedOrigins__0: http://localhost:${OPENAGENT_CHAT_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    ports:
      - "${OPENAGENT_ROUTER_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5001/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  chat:
    build:
      context: .
      dockerfile: Frontend/OpenAgent.Chat/Dockerfile
      args:
        VITE_OPENAGENT_ROUTER_BASE_URL: http://localhost:${OPENAGENT_ROUTER_PORT:-5001}
        VITE_OPENAGENT_ENGINE_BASE_URL: http://localhost:${OPENAGENT_ENGINE_PORT:-5208}
        VITE_OPENAGENT_TENANT_ID: development
    depends_on:
      router:
        condition: service_healthy
    ports:
      - "${OPENAGENT_CHAT_PORT:-8080}:80"

volumes:
  postgres-data:
  redis-data:
