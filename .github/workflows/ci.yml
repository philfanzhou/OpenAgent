name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeact:
    name: Isolated code execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_CODEACT_GVISOR_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install gVisor and document runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-transport-https ca-certificates curl gnupg python3-venv libreoffice-impress libreoffice-calc fonts-noto-cjk
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends runsc
          sudo runsc install
          sudo systemctl restart docker
          docker build --tag openagent-codeact:ci --file docker/codeact/Dockerfile .
          echo "CODEACT_TEST_GVISOR_IMAGE=openagent-codeact:ci" >> "$GITHUB_ENV"
          echo "CODEACT_TEST_SANDBOX_PYTHON=/opt/openagent-code/venv/bin/python" >> "$GITHUB_ENV"
      - name: Test real gVisor isolation and document generation
        run: dotnet test Backend/tests/OpenAgent.Runner.Tests/OpenAgent.Runner.Tests.csproj --configuration Release --nologo --verbosity normal
      - name: Publish and smoke-test Runner service
        run: |
          dotnet publish Backend/src/OpenAgent.Runner/OpenAgent.Runner.csproj --configuration Release --output "$RUNNER_TEMP/openagent-runner"
          export CODEACT_RUNNER_DLL="$RUNNER_TEMP/openagent-runner/OpenAgent.Runner.dll"
          python3 scripts/test-codeact-runner.py
      - name: Test MAF through gVisor Runner and artifact publication
        run: |
          runner_key="$(openssl rand -hex 32)"
          export RUN_CODEACT_RUNNER_TESTS=1
          export CODEACT_TEST_RUNNER_ENDPOINT=http://127.0.0.1:5088
          export CODEACT_TEST_RUNNER_KEY="$runner_key"
          export Runner__ApiKey="$runner_key"
          export Runner__WorkspaceRoot="$RUNNER_TEMP/openagent-runner-workspaces"
          export Runner__DockerPath="/usr/bin/docker"
          export Runner__Runtime="runsc"
          export Runner__SandboxImage="$CODEACT_TEST_GVISOR_IMAGE"
          export Runner__SandboxPythonPath="$CODEACT_TEST_SANDBOX_PYTHON"
          export ASPNETCORE_URLS=http://127.0.0.1:5088
          dotnet "$RUNNER_TEMP/openagent-runner/OpenAgent.Runner.dll" >"$RUNNER_TEMP/openagent-runner.log" 2>&1 &
          runner_pid=$!
          trap 'kill "$runner_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:5088/health >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:5088/health >/dev/null
          dotnet test Backend/tests/OpenAgent.Core.Tests/OpenAgent.Core.Tests.csproj --configuration Release --filter FullyQualifiedName~MafLoop_RealRunner --nologo --verbosity normal
      - name: Show Runner diagnostics on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/openagent-runner.log" ]]; then cat "$RUNNER_TEMP/openagent-runner.log"; fi
          docker ps -a --no-trunc

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Backend/OpenAgent.sln

      - name: Build solution
        run: dotnet build Backend/OpenAgent.sln --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test Backend/OpenAgent.sln --configuration Release --no-build --no-restore --nologo --verbosity normal

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Frontend/OpenAgent.Chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/OpenAgent.Chat/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
