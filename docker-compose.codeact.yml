services:
  code-runner:
    build:
      context: .
      dockerfile: docker/codeact/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5088
      Runner__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?set OPENAGENT_RUNNER_API_KEY to a random 32+ character secret}
      Runner__MaxConcurrentExecutions: ${OPENAGENT_RUNNER_MAX_CONCURRENT_EXECUTIONS:-2}
      Runner__TimeoutSeconds: ${OPENAGENT_RUNNER_TIMEOUT_SECONDS:-120}
      Runner__MemoryMiB: ${OPENAGENT_RUNNER_MEMORY_MIB:-1536}
      Runner__WorkspaceMiB: ${OPENAGENT_RUNNER_WORKSPACE_MIB:-128}
      Runner__MaxProcesses: ${OPENAGENT_RUNNER_MAX_PROCESSES:-64}
    read_only: true
    ports:
      - "127.0.0.1:${OPENAGENT_RUNNER_PORT:-5088}:5088"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /run:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - code-runner-workspaces:/var/lib/openagent-runner/workspaces
    # Bubblewrap must create mount/PID/user namespaces from inside the
    # container. Docker's default seccomp/capability boundary blocks that
    # operation on the supported Docker Desktop/Linux setups, so this service
    # must be isolated as a dedicated Runner host/container.
    privileged: true
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5088/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  code-runner-workspaces:

networks:
  infrastructure:
    external: true
    name: ${OPENAGENT_INFRA_NETWORK:-openagent-infrastructure}
