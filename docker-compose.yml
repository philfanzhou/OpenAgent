services:
  engine:
    image: ${OPENAGENT_ENGINE_IMAGE:-openagent-engine:latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${OPENAGENT_ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5208
      ConnectionStrings__OpenAgentDatabase: Host=postgres;Port=5432;Database=openagent;Username=openagent;Password=openagent
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      ConversationCache__Enabled: "true"
      FileAssets__Enabled: ${OPENAGENT_FILE_ASSETS_ENABLED:-true}
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-}
      OpenTelemetry__ServiceName: openagent-engine
      OpenTelemetry__ServiceVersion: ${OPENAGENT_SERVICE_VERSION:-development}
      FileAssets__ObjectStorage__ServiceUrl: ${OPENAGENT_S3_SERVICE_URL:-http://minio:9000}
      FileAssets__ObjectStorage__ForcePathStyle: "true"
      OPENAGENT_S3_ALLOW_INSECURE_TLS: ${OPENAGENT_S3_ALLOW_INSECURE_TLS:-false}
      FileAssets__ObjectStorage__BucketName: ${OPENAGENT_S3_BUCKET:-openagent-files}
      FileAssets__ObjectStorage__AccessKey: ${OPENAGENT_S3_ACCESS_KEY:-openagent}
      FileAssets__ObjectStorage__SecretKey: ${OPENAGENT_S3_SECRET_KEY:-openagent-secret}
      Engine__AllowMockAgent: ${OPENAGENT_ALLOW_MOCK_AGENT:-true}
      Heartbeat__AdvertisedHost: engine
      Heartbeat__AdvertisedPort: "5208"
      Authentication__AllowDevelopmentAnonymous: "${OPENAGENT_AUTH_ALLOW_DEVELOPMENT_ANONYMOUS:-false}"
      Authentication__Mode: ${OPENAGENT_AUTH_MODE:-JwtBearer}
      Authentication__EnableKeycloak: "${OPENAGENT_AUTH_ENABLE_KEYCLOAK:-true}"
      Authentication__ApiKeyHash: ${OPENAGENT_AUTH_API_KEY_HASH:-}
      Authentication__ApiKeyTenantId: ${OPENAGENT_AUTH_API_KEY_TENANT_ID:-}
      Authentication__ApiKeyClientId: ${OPENAGENT_AUTH_API_KEY_CLIENT_ID:-third-party}
      Authentication__ApiKeyScopes__0: ${OPENAGENT_AUTH_API_KEY_SCOPE_0:-}
      Authentication__ApiKeyScopes__1: ${OPENAGENT_AUTH_API_KEY_SCOPE_1:-}
      Authentication__ApiKeyAudience: ${OPENAGENT_AUTH_API_KEY_AUDIENCE:-openagent-api}
      Authentication__Authority: ${OPENAGENT_KEYCLOAK_PUBLIC_URL:-https://localhost:58081}/realms/openagent
      Authentication__MetadataAddress: ${OPENAGENT_KEYCLOAK_METADATA_ADDRESS:-http://keycloak:8080/realms/openagent/.well-known/openid-configuration}
      Authentication__Audience: ${OPENAGENT_AUTH_AUDIENCE:-openagent-api}
      Authentication__ClientId: ${OPENAGENT_AUTH_CLIENT_ID:-openagent-chat}
      Authentication__RequireHttpsMetadata: ${OPENAGENT_AUTH_REQUIRE_HTTPS_METADATA:-false}
      Authentication__ClockSkewSeconds: ${OPENAGENT_AUTH_CLOCK_SKEW_SECONDS:-60}
      Cors__AllowedOrigins__0: https://${OPENAGENT_PUBLIC_HOST:-localhost}:${OPENAGENT_CHAT_PORT:-8081}
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5208/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  router:
    image: ${OPENAGENT_ROUTER_IMAGE:-openagent-router:latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${OPENAGENT_ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Redis: redis:6379
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-}
      OpenTelemetry__ServiceName: openagent-router
      OpenTelemetry__ServiceVersion: ${OPENAGENT_SERVICE_VERSION:-development}
      RouterSettings__Routing__EngineEndpoint: http://engine:5208
      RouterSettings__IntentRecognition__TimeoutMs: "30000"
      Authentication__AllowDevelopmentAnonymous: "${OPENAGENT_AUTH_ALLOW_DEVELOPMENT_ANONYMOUS:-false}"
      Authentication__Mode: ${OPENAGENT_AUTH_MODE:-JwtBearer}
      Authentication__EnableKeycloak: "${OPENAGENT_AUTH_ENABLE_KEYCLOAK:-true}"
      Authentication__ApiKeyHash: ${OPENAGENT_AUTH_API_KEY_HASH:-}
      Authentication__ApiKeyTenantId: ${OPENAGENT_AUTH_API_KEY_TENANT_ID:-}
      Authentication__ApiKeyClientId: ${OPENAGENT_AUTH_API_KEY_CLIENT_ID:-third-party}
      Authentication__ApiKeyScopes__0: ${OPENAGENT_AUTH_API_KEY_SCOPE_0:-}
      Authentication__ApiKeyScopes__1: ${OPENAGENT_AUTH_API_KEY_SCOPE_1:-}
      Authentication__ApiKeyAudience: ${OPENAGENT_AUTH_API_KEY_AUDIENCE:-openagent-api}
      Authentication__Authority: ${OPENAGENT_KEYCLOAK_PUBLIC_URL:-https://localhost:58081}/realms/openagent
      Authentication__MetadataAddress: ${OPENAGENT_KEYCLOAK_METADATA_ADDRESS:-http://keycloak:8080/realms/openagent/.well-known/openid-configuration}
      Authentication__Audience: ${OPENAGENT_AUTH_AUDIENCE:-openagent-api}
      Authentication__ClientId: ${OPENAGENT_AUTH_CLIENT_ID:-openagent-chat}
      Authentication__RequireHttpsMetadata: ${OPENAGENT_AUTH_REQUIRE_HTTPS_METADATA:-false}
      Authentication__ClockSkewSeconds: ${OPENAGENT_AUTH_CLOCK_SKEW_SECONDS:-60}
      Cors__AllowedOrigins__0: https://${OPENAGENT_PUBLIC_HOST:-localhost}:${OPENAGENT_CHAT_PORT:-8081}
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5001/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  chat:
    image: ${OPENAGENT_CHAT_IMAGE:-openagent-chat:latest}
    depends_on:
      router:
        condition: service_healthy
    networks:
      - infrastructure

  nginx:
    image: nginx:latest
    depends_on:
      chat:
        condition: service_started
      router:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      OPENAGENT_NGINX_CLIENT_MAX_BODY_SIZE: ${OPENAGENT_NGINX_CLIENT_MAX_BODY_SIZE:-64m}
      OPENAGENT_NGINX_SERVER_NAME: ${OPENAGENT_PUBLIC_HOST:-_}
      OPENAGENT_CHAT_PORT: ${OPENAGENT_CHAT_PORT:-8081}
      OPENAGENT_ROUTER_PORT: ${OPENAGENT_ROUTER_PORT:-8082}
      OPENAGENT_ENGINE_PORT: ${OPENAGENT_ENGINE_PORT:-8083}
    ports:
      - "${OPENAGENT_CHAT_PORT:-8081}:${OPENAGENT_CHAT_PORT:-8081}"
      - "${OPENAGENT_ROUTER_PORT:-8082}:${OPENAGENT_ROUTER_PORT:-8082}"
      - "${OPENAGENT_ENGINE_PORT:-8083}:${OPENAGENT_ENGINE_PORT:-8083}"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/tls:ro
    networks:
      - infrastructure

networks:
  infrastructure:
    external: true
    name: ${OPENAGENT_INFRA_NETWORK:-openagent-infrastructure}
