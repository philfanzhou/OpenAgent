# Optional combined startup; independent deployments use <app>.compose.yml.
# Requires Docker Compose >= 2.20. Per-application variables are isolated.
name: ${OPENAGENT_COMPOSE_PROJECT:-openagent-app}
include:
  - path: engine.compose.yml
    env_file: ${OPENAGENT_ENGINE_ENV_FILE:-./engine.env}
  - path: router.compose.yml
    env_file: ${OPENAGENT_ROUTER_ENV_FILE:-./router.env}
  - path: runner.compose.yml
    env_file: ${OPENAGENT_RUNNER_ENV_FILE:-./runner.env}
  - path: chat.compose.yml
    env_file: ${OPENAGENT_CHAT_ENV_FILE:-./chat.env}
