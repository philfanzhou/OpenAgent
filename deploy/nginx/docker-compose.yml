name: openagent-nginx
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${OPENAGENT_CHAT_PORT}:8081"
      - "${OPENAGENT_ROUTER_PORT}:8082"
      - "${OPENAGENT_ENGINE_PORT}:8083"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${OPENAGENT_TLS_CERT_DIR}:/etc/nginx/tls:ro
      - ${OPENAGENT_MAINTENANCE_DIR}:/etc/nginx/maintenance:ro
    networks:
      - openagent

networks:
  openagent:
    # Nginx owns this network; application stacks only join it as external.
    name: openagent
