# Optional identity provider; never started by the default application stack.
name: ${OPENAGENT_INFRA_PROJECT:-openagent-infrastructure}
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://localhost:58081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      KC_HTTPS_PORT: "8443"
      OPENAGENT_CHAT_PUBLIC_URL: ${OPENAGENT_CHAT_PUBLIC_URL:-http://localhost:8081}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ${OPENAGENT_TLS_CERT_DIR:-../openagent/nginx/certs}:/opt/keycloak/conf/certs:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${OPENAGENT_KEYCLOAK_PORT:-58081}:8443"
volumes:
  keycloak-data:
networks:
  default:
    external: true
    name: ${OPENAGENT_APP_NETWORK:-openagent-infrastructure}
