name: openagent-nginx
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${OPENAGENT_CHAT_PORT:-8081}:${OPENAGENT_CHAT_PORT:-8081}"
      - "${OPENAGENT_ROUTER_PORT:-8082}:${OPENAGENT_ROUTER_PORT:-8082}"
      - "${OPENAGENT_ENGINE_PORT:-8083}:${OPENAGENT_ENGINE_PORT:-8083}"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Keep the infrastructure certificate location until that stack is migrated.
      - ${OPENAGENT_TLS_CERT_DIR:-../openagent/nginx/certs}:/etc/nginx/tls:ro
    networks:
      - openagent

networks:
  openagent:
    # Nginx owns this network; application stacks only join it as external.
    name: openagent
