services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagent
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: openagent
    ports:
      - "${OPENAGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d openagent"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${OPENAGENT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles:
      - storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openagent
      MINIO_ROOT_PASSWORD: openagent-secret
    ports:
      - "${OPENAGENT_MINIO_PORT:-9000}:9000"
      - "${OPENAGENT_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 openagent openagent-secret &&
      mc mb --ignore-existing local/openagent-files"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ${OPENAGENT_KEYCLOAK_COMMAND:-start --import-realm}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OPENAGENT_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OPENAGENT_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: https://${OPENAGENT_PUBLIC_HOST:-localhost}:${OPENAGENT_KEYCLOAK_PORT:-58081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: ${OPENAGENT_KEYCLOAK_BACKCHANNEL_DYNAMIC:-true}
      KC_PROXY_HEADERS: ${OPENAGENT_KEYCLOAK_PROXY_HEADERS:-}
      KC_HTTP_ENABLED: ${OPENAGENT_KEYCLOAK_HTTP_ENABLED:-true}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      KC_HTTPS_PORT: "8443"
      OPENAGENT_PUBLIC_HOST: ${OPENAGENT_PUBLIC_HOST:-localhost}
      OPENAGENT_CHAT_PORT: ${OPENAGENT_CHAT_PORT:-8081}
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
      - ./docker/nginx/certs:/opt/keycloak/conf/certs:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${OPENAGENT_KEYCLOAK_PORT:-58081}:8443"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  keycloak-data:

networks:
  default:
    name: ${OPENAGENT_INFRA_NETWORK:-openagent-infrastructure}
