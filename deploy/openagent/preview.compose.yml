# 并行预览实例（engine + router + chat + runner，共享主 openagent 栈的基础设施）
#
# 由 scripts/preview.sh 管理生命周期。不要直接 docker compose up：
# 端口与 Runner API key 需经脚本原子分配，避免与其他预览或主实例冲突。
#
# 共享基础设施（主栈容器）通过 host.docker.internal 直连：
#   postgres / redis / minio 必须在主 openagent 栈中运行并发布到宿主机。
# 测试环境：预览直接复用主实例的 Redis DB 0，共享 agent 目录等应用数据。
# 预览默认使用 Basic + 开发匿名认证（Development 环境、租户 development）；
# 如需联测 Keycloak，设 OPENAGENT_AUTH_MODE=JwtBearer 并覆盖 Keycloak 相关变量。
# 每个预览自带独立 Runner（Bubblewrap 需要 privileged），engine 的 CodeExecution
# 指向该 Runner，用于验证 execute_code 与 skill 脚本执行。
services:
  engine:
    build:
      context: ../..
      dockerfile: Backend/src/OpenAgent.Engine.Host/Dockerfile
    # WSL 空闲关机后，下次启动 Docker 时自动拉回预览。
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5208
      ConnectionStrings__OpenAgentDatabase: Host=host.docker.internal;Port=${OPENAGENT_POSTGRES_PORT:-5432};Database=${OPENAGENT_POSTGRES_DB:-openagent};Username=${OPENAGENT_POSTGRES_USER:-openagent};Password=${OPENAGENT_POSTGRES_PASSWORD:-openagent}
      ConnectionStrings__Redis: host.docker.internal:${OPENAGENT_REDIS_PORT:-6379},defaultDatabase=0
      Database__ApplyMigrationsOnStartup: "true"
      ConversationCache__Enabled: "true"
      FileAssets__Enabled: "true"
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OpenTelemetry__ServiceName: openagent-engine
      OpenTelemetry__ServiceVersion: preview-${PREVIEW_SLUG:-dev}
      FileAssets__ObjectStorage__ServiceUrl: http://host.docker.internal:${OPENAGENT_MINIO_PORT:-9000}
      FileAssets__ObjectStorage__PublicServiceUrl: ${OPENAGENT_S3_PUBLIC_SERVICE_URL:-}
      FileAssets__ObjectStorage__ForcePathStyle: "true"
      FileAssets__ObjectStorage__AccessKey: ${OPENAGENT_S3_ACCESS_KEY:-openagent}
      FileAssets__ObjectStorage__SecretKey: ${OPENAGENT_S3_SECRET_KEY:-openagent-secret}
      Engine__AllowMockAgent: "true"
      Heartbeat__AdvertisedHost: engine
      Heartbeat__AdvertisedPort: "5208"
      CodeExecution__Enabled: "true"
      CodeExecution__Endpoint: http://runner:5209
      CodeExecution__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?managed by scripts/preview.sh}
      Authentication__AllowDevelopmentAnonymous: "${PREVIEW_ALLOW_ANONYMOUS:-true}"
      Authentication__Mode: ${OPENAGENT_AUTH_MODE:-Basic}
      Authentication__EnableKeycloak: "${OPENAGENT_AUTH_ENABLE_KEYCLOAK:-false}"
      Authentication__EnableApiKey: "${OPENAGENT_AUTH_ENABLE_API_KEY:-false}"
      Authentication__Authority: http://localhost:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent
      Authentication__MetadataAddress: http://host.docker.internal:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent/.well-known/openid-configuration
      Authentication__Audience: openagent-api
      Authentication__ClientId: openagent-chat
      Authentication__RequireHttpsMetadata: "false"
      Authentication__ClockSkewSeconds: "60"
      Cors__AllowedOrigins__0: http://localhost:${PREVIEW_CHAT_PORT:-8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runner:
        condition: service_healthy
    ports:
      - "${PREVIEW_ENGINE_PORT:-5210}:5208"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5208/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  runner:
    build:
      context: ../..
      dockerfile: Backend/src/OpenAgent.Runner/Dockerfile
    # WSL 空闲关机后，下次启动 Docker 时自动拉回预览。
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5209
      Runner__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?managed by scripts/preview.sh}
    # Nested Bubblewrap requires a dedicated trusted host/VM.
    privileged: true
    security_opt:
      - seccomp:unconfined
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5209/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  router:
    build:
      context: ../..
      dockerfile: Backend/src/OpenAgent.Router/Dockerfile
    # WSL 空闲关机后，下次启动 Docker 时自动拉回预览。
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Redis: host.docker.internal:${OPENAGENT_REDIS_PORT:-6379},defaultDatabase=0
      OpenTelemetry__OtlpEndpoint: ${OPENAGENT_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OpenTelemetry__ServiceName: openagent-router
      OpenTelemetry__ServiceVersion: preview-${PREVIEW_SLUG:-dev}
      RouterSettings__Routing__EngineEndpoint: http://engine:5208
      RouterSettings__IntentRecognition__TimeoutMs: "30000"
      Authentication__AllowDevelopmentAnonymous: "${PREVIEW_ALLOW_ANONYMOUS:-true}"
      Authentication__Mode: ${OPENAGENT_AUTH_MODE:-Basic}
      Authentication__EnableKeycloak: "${OPENAGENT_AUTH_ENABLE_KEYCLOAK:-false}"
      Authentication__EnableApiKey: "${OPENAGENT_AUTH_ENABLE_API_KEY:-false}"
      Authentication__Authority: http://localhost:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent
      Authentication__MetadataAddress: http://host.docker.internal:${OPENAGENT_KEYCLOAK_PORT:-58081}/realms/openagent/.well-known/openid-configuration
      Authentication__Audience: openagent-api
      Authentication__ClientId: openagent-chat
      Authentication__RequireHttpsMetadata: "false"
      Authentication__ClockSkewSeconds: "60"
      Cors__AllowedOrigins__0: http://localhost:${PREVIEW_CHAT_PORT:-8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "${PREVIEW_ROUTER_PORT:-5010}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5001/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  chat:
    build:
      context: ../..
      dockerfile: Frontend/OpenAgent.Chat/Dockerfile
      args:
        VITE_OPENAGENT_ROUTER_BASE_URL: http://localhost:${PREVIEW_ROUTER_PORT:-5010}
        VITE_OPENAGENT_ENGINE_BASE_URL: http://localhost:${PREVIEW_ENGINE_PORT:-5210}
        VITE_OPENAGENT_TENANT_ID: development
    # WSL 空闲关机后，下次启动 Docker 时自动拉回预览。
    restart: unless-stopped
    depends_on:
      router:
        condition: service_healthy
    ports:
      - "${PREVIEW_CHAT_PORT:-8090}:80"
