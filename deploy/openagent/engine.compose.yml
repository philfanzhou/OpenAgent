name: ${OPENAGENT_COMPOSE_PROJECT:-openagent-engine}
services:
  engine:
    image: ${OPENAGENT_ENGINE_IMAGE:-openagent-engine:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5208
      ConnectionStrings__OpenAgentDatabase: "${ConnectionStrings__OpenAgentDatabase:?Set ConnectionStrings__OpenAgentDatabase}"
      FileAssets__ObjectStorage__ServiceUrl: "${FileAssets__ObjectStorage__ServiceUrl:?Set FileAssets__ObjectStorage__ServiceUrl}"
      FileAssets__ObjectStorage__AccessKey: "${FileAssets__ObjectStorage__AccessKey:?Set FileAssets__ObjectStorage__AccessKey}"
      FileAssets__ObjectStorage__SecretKey: "${FileAssets__ObjectStorage__SecretKey:?Set FileAssets__ObjectStorage__SecretKey}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__Redis: "${ConnectionStrings__Redis:-}"
      FileAssets__ObjectStorage__BucketName: "${FileAssets__ObjectStorage__BucketName:-openagent-files}"
      FileAssets__ObjectStorage__Region: "${FileAssets__ObjectStorage__Region:-us-east-1}"
      FileAssets__ObjectStorage__ForcePathStyle: "${FileAssets__ObjectStorage__ForcePathStyle:-false}"
      FileAssets__ObjectStorage__KeyPrefix: "${FileAssets__ObjectStorage__KeyPrefix:-files}"
      FileAssets__Share__PublicBaseUrl: "${FileAssets__Share__PublicBaseUrl:-}"
      Heartbeat__AdvertisedHost: "${Heartbeat__AdvertisedHost:-engine}"
      Heartbeat__AdvertisedPort: "${Heartbeat__AdvertisedPort:-5208}"
      CodeExecution__Enabled: "${CodeExecution__Enabled:-false}"
      CodeExecution__Endpoint: "${CodeExecution__Endpoint:-http://runner:5209}"
      CodeExecution__ApiKey: "${CodeExecution__ApiKey:-}"
      CodeExecution__RequestTimeoutSeconds: "${CodeExecution__RequestTimeoutSeconds:-180}"
      Authentication__Mode: "${Authentication__Mode:-Basic}"
      Authentication__BasicUsername: "${Authentication__BasicUsername:-admin}"
      Authentication__BasicPassword: "${Authentication__BasicPassword:-}"
      Authentication__BasicTenantId: "${Authentication__BasicTenantId:-default}"
      Authentication__EnableKeycloak: "${Authentication__EnableKeycloak:-false}"
      Authentication__EnableApiKey: "${Authentication__EnableApiKey:-false}"
      Authentication__AllowDevelopmentAnonymous: "${Authentication__AllowDevelopmentAnonymous:-false}"
      Authentication__Authority: "${Authentication__Authority:-}"
      Authentication__Audience: "${Authentication__Audience:-openagent-api}"
      Authentication__ClientId: "${Authentication__ClientId:-openagent-chat}"
      Authentication__MetadataAddress: "${Authentication__MetadataAddress:-}"
      Authentication__RequireHttpsMetadata: "${Authentication__RequireHttpsMetadata:-true}"
      Authentication__ClockSkewSeconds: "${Authentication__ClockSkewSeconds:-60}"
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0:-http://localhost:8081}"
      OpenTelemetry__OtlpEndpoint: "${OpenTelemetry__OtlpEndpoint:-}"
      OPENAGENT_ALLOW_INSECURE_TLS: "${OPENAGENT_ALLOW_INSECURE_TLS:-false}"
      FileAssets__Enabled: "true"
    volumes:
      - engine-data-protection:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5208/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${OPENAGENT_ENGINE_PORT:-5208}:5208"
    networks:
      engine-network:
        aliases:
          - engine
networks:
  engine-network:
    external: true
    name: ${OPENAGENT_APP_NETWORK:-openagent-infrastructure}
volumes:
  engine-data-protection:
