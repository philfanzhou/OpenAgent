# 在现有 engine/router/chat 预览中加入本地 Bubblewrap Runner。
# 用法：
#   docker compose -f docker/preview.compose.yml -f docker/preview.codeact.compose.yml ...
#
# Runner 只用于本地预览，必须使用独立 API key；不要把这个编排用于生产。
services:
  code-runner:
    build:
      context: ..
      dockerfile: docker/codeact/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5088
      Runner__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?set OPENAGENT_RUNNER_API_KEY to a random 32+ character secret}
      Runner__MaxConcurrentExecutions: ${OPENAGENT_RUNNER_MAX_CONCURRENT_EXECUTIONS:-2}
      Runner__TimeoutSeconds: ${OPENAGENT_RUNNER_TIMEOUT_SECONDS:-120}
      Runner__MemoryMiB: ${OPENAGENT_RUNNER_MEMORY_MIB:-1536}
      Runner__WorkspaceMiB: ${OPENAGENT_RUNNER_WORKSPACE_MIB:-128}
      Runner__MaxProcesses: ${OPENAGENT_RUNNER_MAX_PROCESSES:-64}
    read_only: true
    ports:
      - "127.0.0.1:${PREVIEW_RUNNER_PORT:-5089}:5088"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /run:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - preview-code-runner-workspaces:/var/lib/openagent-runner/workspaces
    privileged: true
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5088/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  engine:
    depends_on:
      code-runner:
        condition: service_healthy
    environment:
      CodeExecution__Enabled: "true"
      CodeExecution__Endpoint: http://code-runner:5088
      CodeExecution__ApiKey: ${OPENAGENT_RUNNER_API_KEY:?set OPENAGENT_RUNNER_API_KEY to a random 32+ character secret}
      CodeExecution__RequestTimeoutSeconds: ${OPENAGENT_CODE_EXECUTION_TIMEOUT_SECONDS:-180}

volumes:
  preview-code-runner-workspaces:
